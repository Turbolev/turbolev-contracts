[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.22"
optimizer = true
optimizer_runs = 400
via_ir = true

[profile.dev]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.22"
optimizer = false
via_ir = false

# Exclude legacy tests from forge test runs
no_match_path = "**/vault-legacy/**"

# Fuzz testing settings
[profile.default.fuzz]
runs = 256

# Formatter settings
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Documentation
auto_detect_solc = false
offline = false

# File system permissions for scripts
fs_permissions = [
    { access = "read", path = "./" },
    { access = "write", path = "./deployments" },
    { access = "read", path = "./out" },
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
