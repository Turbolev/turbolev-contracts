[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.22"
optimizer = true
optimizer_runs = 1000
via_ir = true

# Formatter settings
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Documentation
auto_detect_solc = false
offline = false

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
